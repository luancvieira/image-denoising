[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microct-denoising"
version = "0.2.0"
description = "Fast-to-long micro-CT denoising: aluminium standardization, nested leave-one-plug-out training, evaluation and segmentation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.7",
    "matplotlib>=3.7",
    "netcdf4>=1.6",
    "numpy>=1.24",
    "pillow>=9.0",
    "scikit-image>=0.21",
    "scipy>=1.10",
    "torch>=2.0",
    "xarray>=2023.1",
]

[project.scripts]
microct-standardize = "microct_denoising.standardize:main"
microct-train = "microct_denoising.train:main"
microct-select-predict = "microct_denoising.select_predict:main"
microct-predict = "microct_denoising.predict:main"
microct-evaluate = "microct_denoising.metrics:main"
microct-segment = "microct_denoising.segmentation:main"

[tool.setuptools.packages.find]
where = ["src"]
